<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>반짝반짝 놀이코딩</title>
  <style>
    :root{
      --bg1:#f7fbff; --bg2:#fffceb; --line:#e3edf5; --ink:#28404a; --sub:#5a7480;
      --card:#ffffff; --shadow:0 10px 25px rgba(40,64,74,.10); --radius:26px;
      --green:#76c35d; --green-deep:#3a904c; --orange:#ff9f70; --orange-deep:#cf6b48;
      --blue:#66b8ff; --blue-deep:#2f7ac5; --purple:#b892ff; --purple-deep:#7f5fd1;
      --yellow:#ffd25f; --yellow-deep:#b27b00;
    }
    *{box-sizing:border-box}
    body{margin:0; font-family:"Malgun Gothic",system-ui,sans-serif; color:var(--ink);
      background:radial-gradient(circle at 10% 0%, #eef8ff 0 18%, transparent 18%),
                 radial-gradient(circle at 90% 0%, #fff2ca 0 16%, transparent 16%),
                 linear-gradient(180deg,var(--bg1),var(--bg2));}
    button{font:inherit; cursor:pointer}
    .wrap{max-width:1320px; margin:0 auto; padding:22px 18px 46px}
    .topbar{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px}
    .brand{display:flex; align-items:center; gap:12px; font-weight:900; font-size:clamp(24px,3vw,34px)}
    .brandMark{width:58px; height:58px; border-radius:18px; display:grid; place-items:center; background:#ffe26c; box-shadow:var(--shadow); font-size:28px}
    .topBtns{display:flex; gap:10px; flex-wrap:wrap}
    .btn{border:2px solid var(--line); background:#fff; border-radius:16px; padding:12px 16px; min-height:52px; font-weight:800; color:#334}
    .hero{display:grid; grid-template-columns:1.15fr .85fr; gap:26px; align-items:center; background:linear-gradient(90deg,#cceaf7,#efe7a8); border:3px solid #fff; border-radius:34px; padding:28px 42px; box-shadow:var(--shadow); margin-bottom:16px}
    .pillRow{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px}
    .pill{background:#f9f6eb; color:#27717a; border-radius:999px; padding:10px 16px; font-weight:900; font-size:14px}
    .hero h1{overflow-wrap:normal;margin:0; font-size:clamp(42px,4.7vw,64px); line-height:1.1; letter-spacing:-1.5px; white-space:nowrap;max-width:100%}
    .hero p{margin:16px 0 0; font-size:clamp(22px,2.2vw,28px); line-height:1.55; font-weight:800; color:#3d6d7b}
    .heroArt{display:flex; flex-direction:column; gap:12px; align-items:center}
    .heroArtFrame{width:100%; max-width:700px; aspect-ratio:16/7; background:#fff; border:5px solid #fff; border-radius:28px; overflow:hidden; box-shadow:0 10px 25px rgba(72,97,107,.14)}
    .heroArtFrame img{width:100%; height:100%; object-fit:contain;display:block;background:#f7f5ef}
    .heroIcons{background:#fff; padding:10px 22px; border-radius:999px; display:flex; gap:12px; font-size:24px; box-shadow:0 8px 18px rgba(0,0,0,.06)}
    .status{display:flex; align-items:center; gap:14px; flex-wrap:wrap; background:#fff; border:2px solid var(--line); border-radius:22px; padding:14px 16px; box-shadow:var(--shadow); margin-bottom:16px}
    .status strong{font-size:17px}
    .track{flex:1 1 260px; height:16px; border-radius:999px; background:#edf3f7; overflow:hidden}
    .bar{height:100%; width:0%; background:linear-gradient(90deg,#ffd55b,#77d365); border-radius:999px}
    .toolbar{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:16px}
    .filters,.pages{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
    .chip{border:2px solid var(--line); background:#fff; border-radius:999px; padding:10px 15px; font-weight:800; color:#48606a}
    .chip.active{background:#3aaee4; color:#fff; border-color:#3aaee4}
    .pageBtn{width:46px; height:46px; display:grid; place-items:center; border:2px solid var(--line); background:#fff; border-radius:14px; font-weight:900}
    .pageBtn.active{background:#ffcc5c; border-color:#ffcc5c; color:#6d4a00}
    .cards{display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:18px}
    .card{background:var(--card); border:2px solid #eef3f6; border-radius:26px; overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; text-align:left; min-width:0}
    .card figure{margin:0; aspect-ratio:4/5; background:#eef5f8}
    .card img{width:100%; height:100%; object-fit:contain; display:block;background:#edf5f8}
    .cardBody{padding:15px 16px 18px; display:flex; flex-direction:column; gap:10px; flex:1}
    .tag{align-self:flex-start; padding:6px 11px; border-radius:999px; font-size:13px; font-weight:900; background:#eef7ff; color:#4c80b7}
    .card h3{margin:0; font-size:25px; line-height:1.3; letter-spacing:-.7px}
    .card p{margin:0; color:var(--sub); line-height:1.5; font-weight:700; min-height:48px}
    .cardFooter{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto}
    .start{padding:10px 14px; border-radius:13px; border:none; background:#6b71f0; color:#fff; font-weight:900}
    .workspace{display:none}
    .workspace.active{display:block}
    .gameHead{display:flex; justify-content:space-between; align-items:flex-start; gap:14px; flex-wrap:wrap; margin-bottom:14px}
    .gameTitleWrap{display:flex; gap:14px; align-items:center; min-width:0}
    .gameThumb{width:84px; height:84px; border-radius:22px; border:4px solid #fff; box-shadow:var(--shadow); object-fit:contain; background:#f4fafb; flex:0 0 auto}
    .gameTitleWrap h2{margin:0; font-size:clamp(30px,3vw,42px); line-height:1.2}
    .gameTitleWrap p{margin:6px 0 0; color:var(--sub); font-weight:800; font-size:18px}
    .levels{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:16px}
    .levelBtn{border:2px solid var(--line); background:#fff; border-radius:16px; min-height:52px; min-width:88px; padding:10px 14px; font-weight:900}
    .levelBtn.active{background:#5db3ff; color:#fff; border-color:#5db3ff}
    .levelBtn.done:not(.active){background:#e7fff0; border-color:#9ce0b1}
    .playGrid{display:grid; grid-template-columns:minmax(0,1.06fr) minmax(330px,.94fr); gap:20px}
    .pane{background:#fff; border:2px solid #eef3f6; border-radius:28px; padding:18px; box-shadow:var(--shadow); min-width:0}
    .pane h3{margin:0 0 12px; font-size:32px}
    .mission{background:#eef7fb; border:2px solid #d3e9f6; border-radius:20px; padding:16px 18px; font-size:clamp(21px,2vw,27px); line-height:1.5; font-weight:900; color:#336d85; margin-bottom:14px}
    .sceneBanner{position:relative; height:160px; border-radius:22px; overflow:hidden; border:3px solid #e7eef3; margin-bottom:14px}
    .sceneBanner{background:linear-gradient(95deg,#eafaf0 0%,#f1f8ff 52%,#fcf3d7 100%);display:flex;align-items:center;justify-content:flex-end}
    .sceneBanner img{width:37%;height:100%;object-fit:contain;object-position:center;display:block}
    .sceneLabel{z-index:1;left:20px;bottom:auto;top:50%;transform:translateY(-50%);max-width:58%;border-radius:18px;white-space:normal;line-height:1.5}
    .sceneLabel{position:absolute; left:14px; bottom:14px; background:rgba(255,255,255,.94); color:#2f5f75; border-radius:999px; padding:8px 14px; font-size:17px; font-weight:900}
    .sceneArea{min-height:420px; display:flex; flex-direction:column; align-items:center; justify-content:flex-start}
    .note{font-size:17px; line-height:1.7; color:#58727b; font-weight:700; margin-top:14px}
    .board{width:min(100%,520px);aspect-ratio:1;display:grid;grid-template-rows:repeat(4,minmax(0,1fr));gap:8px; margin:6px auto 0; background:#d8f17d00}
    .cell{aspect-ratio:1; min-width:0; min-height:0;overflow:hidden; display:grid; place-items:center; border-radius:16px; border:2px solid #e7f0dc; background:#cfe4b9; font-size:clamp(29px,4vw,50px)}
    .cell.alt{background:#c6dfb0}
    .cell.wall{background:#e3d9c9; border-color:#d4c6b0}
    .cell.goal{background:#f1e6a8; border-color:#e7d27f}
    .cell.star{background:#fff2ca; border-color:#eed87b}
    .controlsGuide{font-size:18px; font-weight:800; color:#5b6776; line-height:1.6; margin:0 0 12px}
    .palette{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px}
    .arrowBtn,.choiceBtn{min-width:0; min-height:96px; border-radius:18px; border:2px solid #cfdaf0; border-bottom-width:5px; background:#eef5ff; font-size:38px; font-weight:900; color:#3b5e90; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; padding:6px}
    .arrowBtn small,.choiceBtn small{font-size:16px; line-height:1.3; text-align:center}
    .sequence{min-height:116px; margin:14px 0; padding:12px; border-radius:20px; border:3px dashed #d9e1ed; background:#fbfdff; display:flex; flex-wrap:wrap; gap:8px; align-content:flex-start}
    .seqItem{min-width:58px; min-height:58px; border:none; border-radius:14px; background:#6c7aea; color:#fff; font-size:30px; display:grid; place-items:center; font-weight:900}
    .placeholder{font-size:18px; font-weight:800; color:#748493; padding:8px}
    .actions{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
    .action{min-height:62px; border:none; border-radius:18px; font-size:clamp(18px,1.8vw,22px); font-weight:1000; padding:10px 12px}
    .primary{background:#ffd15c; color:#584000}
    .secondary{background:#eef3fa; color:#36506b}
    .next{background:#54b4ff; color:#fff}
    .notice{margin-top:14px; background:#edf7ff; border-radius:18px; padding:14px 16px; min-height:72px; font-size:20px; line-height:1.55; color:#2f6d8a; font-weight:900}
    .bigIcon{font-size:120px; line-height:1.1; margin:16px 0 12px}
    .choiceGrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
    .choiceBtn{min-height:118px; font-size:52px; background:#fff4d8; border-color:#f6e1a3; color:#715a17}
    .patternLine{display:flex; justify-content:center; align-items:center; flex-wrap:wrap; gap:10px; margin:18px 0}
    .bubble{width:78px; aspect-ratio:1/1; border-radius:18px; display:grid; place-items:center; background:#f1ecff; border:2px solid #ddd5fb; font-size:42px}
    .bubble.q{background:#fff6d4; border-style:dashed; border-color:#e7c961}
    .overlay{position:fixed; inset:0; display:none; place-items:center; background:rgba(33,49,66,.52); padding:20px; z-index:20}
    .overlay.show{display:grid}
    .modal{width:min(100%,520px); background:#fff; border-radius:30px; padding:30px; text-align:center; box-shadow:0 20px 50px rgba(0,0,0,.18)}
    .modal .icon{font-size:88px}
    .modal h4{margin:8px 0 10px; font-size:34px}
    .modal p{margin:0 0 16px; font-size:22px; line-height:1.6; font-weight:800}
    .modal .action,.modal .btn{width:100%; margin-top:10px}
    .hidden{display:none !important}
    footer{margin-top:30px; text-align:center; color:#83919a; font-size:14px}

    body[data-theme="forest"] .mission, body[data-theme="forest"] .notice{background:#eef9e4}
    body[data-theme="forest"] .mission{border-color:#d7efbe; color:#467429}
    body[data-theme="kitchen"] .mission, body[data-theme="kitchen"] .notice{background:#fff0e8}
    body[data-theme="kitchen"] .mission{border-color:#ffd1bf; color:#a45436}
    body[data-theme="lab"] .mission, body[data-theme="lab"] .notice{background:#e9f6ff}
    body[data-theme="lab"] .mission{border-color:#c8e7fb; color:#296da7}
    body[data-theme="purple"] .mission, body[data-theme="purple"] .notice{background:#f2eaff}
    body[data-theme="purple"] .mission{border-color:#dbc8ff; color:#7550bf}
    body[data-theme="gold"] .mission, body[data-theme="gold"] .notice{background:#fff6dc}
    body[data-theme="gold"] .mission{border-color:#f0dc9e; color:#8b6812}

    @media (max-width:1180px){
      .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
      .hero{grid-template-columns:1fr}
      .hero h1{white-space:normal}
    }
    @media (max-width:900px){
      .playGrid{grid-template-columns:1fr}
      .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
    }
    @media (max-width:620px){
      .wrap{padding:14px 12px 30px}
      .brand{font-size:25px}
      .brandMark{width:50px;height:50px}
      .hero{padding:22px 18px; border-radius:26px}
      .hero h1{font-size:42px}
      .hero p{font-size:20px}
      .status,.toolbar{gap:10px}
      .cards{grid-template-columns:1fr}
      .card h3{font-size:24px}
      .gameThumb{width:66px;height:66px;border-radius:18px}
      .gameTitleWrap h2{font-size:30px}
      .pane{padding:15px}
      .mission{font-size:21px}
      .sceneBanner{height:128px}
      .sceneArea{min-height:300px}
      .palette{gap:8px}
      .arrowBtn{min-height:85px; font-size:30px}
      .choiceBtn{font-size:42px; min-height:110px}
      .bubble{width:58px; font-size:32px}
      .actions{grid-template-columns:1fr 1fr}
      .action{font-size:18px; min-height:58px}
    }

/* 안정적인 정렬 및 동일한 크기의 게임판: 최종 개선 */
.hero{grid-template-columns:minmax(0,1.17fr) minmax(0,.83fr);gap:20px;padding:26px 34px}
.hero h1{font-size:clamp(29px,3.12vw,44px);white-space:nowrap;letter-spacing:-1.3px;line-height:1.33}
.hero p{font-size:clamp(16px,1.5vw,20px);white-space:nowrap;line-height:1.55;margin-top:10px;letter-spacing:-.6px}
.pillRow{flex-wrap:nowrap;gap:7px}
.pill{font-size:13px;padding:7px 12px;white-space:nowrap;max-width:100%}
.heroArtFrame{aspect-ratio:16/6;min-width:0}
.heroIcons{white-space:nowrap;max-width:100%;font-size:20px;gap:5px;padding:8px 15px}
.toolbar{flex-wrap:nowrap;align-items:center;gap:16px}
.filters{flex-wrap:nowrap;gap:7px;min-width:0}
.pages{flex-wrap:nowrap;gap:8px;white-space:nowrap;max-width:100%}
.chip{white-space:nowrap;font-size:15px;padding:9px 14px}
.cards{grid-template-columns:repeat(3,minmax(0,1fr));gap:19px}
.card figure{aspect-ratio:16/11;overflow:hidden}
.card img{object-position:center 43%}
.card h3{font-size:clamp(23px,2.1vw,29px)}
.cardFooter{flex-wrap:wrap}
.board{width:min(100%,500px);aspect-ratio:1/1;grid-auto-flow:row;grid-template-rows:repeat(var(--board-size,4), minmax(0,1fr));grid-auto-rows:minmax(0,1fr);gap:6px;padding:11px;border-radius:22px;border:3px solid #d5e6f3;background:#e8f5fd;overflow:hidden;align-self:center;flex-shrink:0}
.board .cell{box-sizing:border-box;width:100%;height:100%;aspect-ratio:auto;min-width:0;min-height:0;overflow:hidden;border-width:2px;font-size:clamp(24px,calc(180px / var(--board-size,4)),53px);line-height:1;display:grid;place-items:center;border-radius:13px}
.sceneArea{width:100%;min-width:0;min-height:0}
.pane{min-width:0}
.gameTitleWrap{min-width:0}
.gameTitleWrap h2{overflow-wrap:normal;word-break:keep-all}
.choiceBtn small{overflow-wrap:break-word;word-break:keep-all}
button:focus-visible{outline:4px solid #ffae48;outline-offset:3px}
@media (max-width:1180px){.hero{grid-template-columns:minmax(0,1fr) minmax(0,.75fr)}.hero h1{white-space:normal}.hero p{white-space:normal}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{flex-wrap:wrap}}
@media (max-width:900px){.hero{grid-template-columns:1fr}.hero h1{white-space:normal}.hero p{white-space:normal}.filters{max-width:100%;overflow-x:auto;padding-bottom:4px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.hero h1{font-size:clamp(29px,8vw,40px)}.hero p{font-size:18px}.pillRow{flex-wrap:wrap}.cards{grid-template-columns:1fr}.toolbar{align-items:flex-start}.filters{width:100%;overflow-x:auto}.pageBtn{width:43px;height:43px}.board{padding:7px;gap:4px;width:min(100%,450px)}.board .cell{border-radius:9px;font-size:clamp(21px,calc(140px / var(--board-size,4)),46px)}}

  
/* 10개 놀이를 5열 × 2행으로 한 화면에서 선택 */
#homeView .toolbar{justify-content:center;margin:10px 0 18px}
#homeView .filters{justify-content:center;gap:10px}
#homeView .cards{grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;align-items:stretch}
#homeView .card{min-width:0;border-radius:19px}
#homeView .card figure{aspect-ratio:1.55/1;min-height:0}
#homeView .card img{object-fit:cover;object-position:center 43%}
#homeView .cardBody{padding:12px 13px 14px;gap:6px}
#homeView .card h3{font-size:clamp(17px,1.5vw,22px);line-height:1.25;min-height:0;word-break:keep-all}
#homeView .card p{font-size:14px;min-height:0;line-height:1.36}
#homeView .tag{font-size:12px;padding:4px 9px}
#homeView .cardFooter{gap:6px;align-items:center;flex-wrap:wrap}
#homeView .cardFooter strong{font-size:13px;white-space:nowrap}
#homeView .start{font-size:13px;padding:8px 9px;white-space:nowrap}
body:not(.game-mode) .hero{padding:18px 30px;min-height:0;gap:16px}
body:not(.game-mode) .hero h1{font-size:clamp(29px,3.2vw,43px)}
body:not(.game-mode) .hero p{font-size:19px;margin-top:8px}
body:not(.game-mode) .heroArtFrame{max-height:140px}
body:not(.game-mode) .heroIcons{display:none}
body:not(.game-mode) .pillRow{margin-bottom:8px}
@media (max-width:1000px){#homeView .cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:680px){#homeView .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}#homeView .card h3{font-size:18px}#homeView .card figure{aspect-ratio:1.3/1}#homeView .card p{font-size:13px}#homeView .start{font-size:12px}body:not(.game-mode) .hero{padding:16px}body:not(.game-mode) .heroArt{display:none}}
@media (max-width:380px){#homeView .cards{grid-template-columns:1fr}#homeView .card figure{aspect-ratio:2/1}}

</style>
</head>
<body data-theme="forest">
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><div class="brandMark">🎮</div><div>반짝반짝 놀이코딩</div></div>
      <div class="topBtns">
        <button class="btn" id="homeBtn">🏠 처음으로</button>
        <button class="btn" id="soundBtn" aria-pressed="true">🔊 효과음 끄기</button>
      </div>
    </div>

    <section class="hero">
      <div>
        <div class="pillRow"><span class="pill">PLAY & LEARN</span><span class="pill">상상하고 움직이는 코딩 모험</span></div>
        <h1 id="heroTitle">어떤 놀이를 해 볼까?</h1>
        <p id="heroDesc">열 가지 놀이 세상에서 신나는 코딩 모험을 시작해요!</p>

  function playTone(kind='tap'){
    if(!soundOn || !synth) return;
    try{
      audio ??= new synth();
      const now = audio.currentTime;
      const beep = (freq, start, dur, type='triangle', gain=.035) => {
        const o = audio.createOscillator(); const g = audio.createGain();
        o.type = type; o.frequency.setValueAtTime(freq,start); g.gain.setValueAtTime(gain,start);
        g.gain.exponentialRampToValueAtTime(.001,start+dur); o.connect(g); g.connect(audio.destination); o.start(start); o.stop(start+dur);
      };
      if(kind==='tap'){ beep(760, now, .08); beep(1000, now+.05, .08, 'sine', .025); }
      else if(kind==='step'){ beep(620, now, .07, 'triangle', .03); }
      else if(kind==='star'){ beep(780, now, .08); beep(1040, now+.07, .09); beep(1280, now+.14, .12, 'sine', .025); }
      else if(kind==='win'){ beep(660, now, .08); beep(880, now+.08, .1); beep(1180, now+.19, .12); beep(1520, now+.31, .18, 'sine', .025); }
      else if(kind==='error'){ beep(310, now, .1, 'sawtooth', .02); beep(250, now+.09, .12, 'sawtooth', .018); }
    }catch(e){}
  }

  // 그림의 표시 순서만 섞고, 정답 판정에 쓰는 원래 인덱스는 유지합니다.

  function shuffledChoices(data){
    const items = data.steps.map((step, idx)=>({step,idx}));
    for(let i=items.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [items[i],items[j]]=[items[j],items[i]];
    }
    if(items.length>1 && items.every((item,i)=>item.idx===data.order[i])){
      [items[0],items[1]]=[items[1],items[0]];
    }
    return items;
  }

        const isGoal = data.end[0]===x && data.end[1]===y;
        const isStar = (data.stars||[]).some(v=>v[0]===x&&v[1]===y) && !stars.some(v=>v[0]===x&&v[1]===y);

  }

  async function run(){
    const data = level(); if(busy) return;
    if(data.type==='pattern'){
      if(seq[0]===data.answer) win(); else { setMessage('💡 아쉬워요! 반복되는 그림을 다시 살펴보세요.'); playTone('error'); }
      return;
    }
    if(seq.length===0){ setMessage('먼저 그림이나 화살표를 눌러 주세요!'); return; }
    if(data.type==='sequence'){
      if(seq.length !== data.order.length){ setMessage(`아직 ${data.order.length - seq.length}개의 그림을 더 골라야 해요.`); return; }
      if(seq.every((v,i)=>v===data.order[i])) win(); else { setMessage('💡 순서가 달라요! 먼저 해야 할 일을 생각해 봐요.'); playTone('error'); }
      return;
    }
    setBusy(true); pos = [...data.start]; stars=[]; drawBoard(data); setMessage('출발! 어떤 길로 움직일까요?'); await wait(260);
    let error='';
    for(const step of seq){
      const [dx,dy] = dirs[step]; const nx = pos[0]+dx; const ny = pos[1]+dy;
      if(nx<0 || ny<0 || nx>=data.n || ny>=data.n){ error='놀이판 밖으로 나갔어요. 화살표를 고쳐 보세요.'; break; }
      if((data.walls||[]).some(v=>v[0]===nx && v[1]===ny)){ error='돌멩이에 부딪혔어요. 돌아가는 길을 찾아요.'; break; }
      pos = [nx,ny];
      if((data.stars||[]).some(v=>v[0]===nx && v[1]===ny) && !stars.some(v=>v[0]===nx&&v[1]===ny)){ stars.push([nx,ny]); playTone('star'); }
      else playTone('step');
      drawBoard(data); await wait(360);
    }
    setBusy(false);
    if(!error && pos[0]===data.end[0] && pos[1]===data.end[1]){
      if(stars.length === (data.stars||[]).length){ win(); return; }
      error = `아직 별 ${(data.stars||[]).length - stars.length}개가 남았어요. 모두 모아 봐요!`;
    }else if(!error){ error='목적지까지 조금 더 가야 해요. 화살표를 추가해 봐요!'; }
    setMessage('💡 ' + error); playTone('error');
  }

  function reset(){ if(busy) return; seq=[]; stars=[]; const data=level(); if(data.start) pos=[...data.start]; renderLevelContent(); setMessage('처음부터 다시 도전해요!'); }
  function next(){ if(busy) return; $('#overlay').classList.remove('show'); if(currentLevel===lastIndex()) renderHome(); else loadLevel(currentLevel+1); }

  $('#runBtn').onclick = run;
  $('#undoBtn').onclick = ()=>{ if(busy || !seq.length) return; seq.pop(); if(level().type==='sequence') renderChoiceState(); renderSequenceBar(); };
  $('#resetBtn').onclick = reset;
  $('#nextBtn').onclick = next;
  $('#modalNext').onclick = next;
  $('#modalClose').onclick = ()=> $('#overlay').classList.remove('show');
  $('#homeBtn').onclick = renderHome;
  $('#backBtn').onclick = renderHome;
  $('#soundBtn').onclick = ()=>{ soundOn = !soundOn; $('#soundBtn').textContent = soundOn ? '🔊 효과음 끄기' : '🔈 효과음 켜기'; $('#soundBtn').setAttribute('aria-pressed', String(soundOn)); playTone('tap'); };

  updateProgress(); renderHome();
})();
</script>
</body>
</html>
